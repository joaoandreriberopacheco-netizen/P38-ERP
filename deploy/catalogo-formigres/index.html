<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="robots" content="noindex, nofollow" />
  <title>Catálogo — acesso restrito</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f4f5;
      color: #3f3f46;
      padding: 24px;
      text-align: center;
    }
    main { max-width: 28rem; }
    h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.5rem; color: #18181b; }
    p { margin: 0; font-size: 0.9375rem; line-height: 1.5; }

<body>
  <main>
    <h1>Acesso restrito</h1>
    <p>Este catálogo só abre com o link completo enviado pela P38. Se precisar de um novo acesso, contacte a equipa.</p>

</html>
