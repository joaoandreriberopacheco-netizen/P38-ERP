<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P38 — a caminho da Torre…</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #e2e8f0; }
    .box { text-align: center; padding: 1.5rem; max-width: 20rem; }
    .spin { width: 2rem; height: 2rem; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <p id="msg">A levar o arquivo até à Torre de controle…</p>
  </div>
  <script>
(function () {
  var DB_NAME = 'p38-share-target';
  var STORE = 'files';
  var params = new URLSearchParams(window.location.search);
  var sharedId = params.get('shared-id') || '';
  var sharedPath = params.get('shared') || '';
  var shareError = params.get('share-error') || '';
  var maxTentativas = 40;
  var intervaloMs = 150;

  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 2);
      req.onupgradeneeded = function (ev) {
        var db = ev.target.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        if (!db.objectStoreNames.contains('ledger')) db.createObjectStore('ledger');
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbHasFile(id) {
    if (!id) return Promise.resolve(false);
    return openDb().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).get(id);
        req.onsuccess = function () {
          var rec = req.result;
          resolve(Boolean(rec && rec.buffer && rec.buffer.byteLength > 0));
        };
        req.onerror = function () { resolve(false); };
      });
    }).catch(function () { return false; });
  }

  function irParaTorre(extra) {
    var qs = new URLSearchParams(window.location.search);
    if (extra) {
      Object.keys(extra).forEach(function (k) { qs.set(k, extra[k]); });
    }
    qs.set('share-target', '1');
    if (sharedId) {
      try { sessionStorage.setItem('p38-share-pending', sharedId); } catch (_) {}
      document.cookie = 'p38_share_id=' + encodeURIComponent(sharedId) + '; Path=/; Max-Age=300; SameSite=Lax';
    }
    window.location.replace('/AnexoCompartilhado?' + qs.toString());
  }

  if (shareError) {
    irParaTorre();
    return;
  }

  var tentativa = 0;
  function esperarPacote() {
    tentativa++;
    var precisaIdb = Boolean(sharedId);
    var promessa = precisaIdb ? idbHasFile(sharedId) : Promise.resolve(true);

    promessa.then(function (ok) {
      if (ok || tentativa >= maxTentativas) {
        if (!ok && tentativa >= maxTentativas) {
          irParaTorre({ 'share-error': 'corridor-timeout' });
        } else {
          irParaTorre();
        }
        return;
      }
      setTimeout(esperarPacote, intervaloMs);
    });
  }

  try {
    var ch = new BroadcastChannel('p38-share-package');
    ch.onmessage = function (ev) {
      if (ev.data && ev.data.type === 'SHARE_PACKAGE_READY' && ev.data.id === sharedId) {
        irParaTorre();
      }
    };
  } catch (_) {}

  esperarPacote();
})();
  </script>
</body>
</html>
