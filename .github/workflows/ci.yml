# CI — build e smoke (estrutural + HTTP)
# Complementa "Vercel Deploy" (produção).

name: CI

on:
  push:
    branches: [main, staging, 'cursor/**']
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke — estrutura do repositório
        run: npm run smoke:structure

      - name: Build Next (placeholder env + bypass auth para sensores)
        env:
          NEXT_PUBLIC_P38_PROVIDER: supabase
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci1wbGFjZWhvbGRlcg
          NEXT_PUBLIC_P38_USE_SUPABASE_AUTH: 'false'
          NEXT_PUBLIC_P38_BYPASS_BASE44: 'true'
          VITE_P38_PROVIDER: supabase
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci1wbGFjZWhvbGRlcg
          VITE_P38_USE_SUPABASE_AUTH: 'false'
          VITE_P38_BYPASS_BASE44: 'true'
        run: npm run build

      - name: Verificar output Next
        run: test -d .next

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Pulso — comboio (pré-deploy ~20s)
        env:
          PULSE_SKIP_BUILD: '1'
          NEXT_PUBLIC_P38_PROVIDER: supabase
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci1wbGFjZWhvbGRlcg
          NEXT_PUBLIC_P38_USE_SUPABASE_AUTH: 'false'
          NEXT_PUBLIC_P38_BYPASS_BASE44: 'true'
          VITE_P38_PROVIDER: supabase
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci1wbGFjZWhvbGRlcg
          VITE_P38_USE_SUPABASE_AUTH: 'false'
          VITE_P38_BYPASS_BASE44: 'true'
        run: |
          npx playwright install chromium
          npm run pulse:predeploy:ci

      - name: Pulso — shipping crítico (fluxos compostos / estados salvos)
        env:
          PULSE_SKIP_BUILD: '1'
          NEXT_PUBLIC_P38_PROVIDER: supabase
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci1wbGFjZWhvbGRlcg
          NEXT_PUBLIC_P38_USE_SUPABASE_AUTH: 'false'
          NEXT_PUBLIC_P38_BYPASS_BASE44: 'true'
          VITE_P38_PROVIDER: supabase
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci1wbGFjZWhvbGRlcg
          VITE_P38_USE_SUPABASE_AUTH: 'false'
          VITE_P38_BYPASS_BASE44: 'true'
        run: npm run pulse:shipping:critico -- --skip-build
