# Monitor semanal de uso Supabase (proxy PostgREST + Storage).
# Egress em GB: só no dashboard Supabase → Usage → Egress.
#
# Secrets: DATABASE_URL, SUPABASE_ACCESS_TOKEN, VITE_SUPABASE_URL (opcional)

name: Supabase Usage Monitor

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Monitor Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: npm run monitor:supabase-usage
